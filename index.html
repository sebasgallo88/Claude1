<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PianoMaster - Aprende Piano</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/piano.css">
    <link rel="stylesheet" href="css/lessons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="header">
            <div class="header-left">
                <h1 class="logo">🎹 PianoMaster</h1>
            </div>
            <nav class="header-nav">
                <button class="nav-btn active" data-view="free">Práctica Libre</button>
                <button class="nav-btn" data-view="lessons">Lecciones</button>
                <button class="nav-btn" data-view="songs">Canciones</button>
            </nav>
            <div class="header-right">
                <button id="mic-btn" class="mic-btn" title="Activar micrófono">
                    <span class="mic-icon">🎤</span>
                    <span class="mic-label">Micrófono OFF</span>
                </button>
                <button id="settings-btn" class="settings-btn" title="Configuración">⚙️</button>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content">
            <!-- Audio Detection Display -->
            <div id="detection-display">
                <div id="detected-note-container">
                    <div id="detected-note" class="note-display">-</div>
                    <div id="detected-octave" class="octave-display"></div>
                    <div id="detected-frequency" class="freq-display">Activa el micrófono para comenzar</div>
                </div>
                <div id="pitch-meter">
                    <div id="pitch-indicator"></div>
                    <div class="pitch-center-mark"></div>
                    <span class="pitch-label flat">♭</span>
                    <span class="pitch-label sharp">♯</span>
                </div>
                <div id="volume-meter">
                    <div id="volume-bar"></div>
                </div>
            </div>

            <!-- Lesson/Song Display Area -->
            <div id="lesson-area" class="hidden">
                <div id="lesson-header">
                    <button id="lesson-back-btn" class="back-btn">← Volver</button>
                    <h2 id="lesson-title"></h2>
                    <div id="lesson-progress">
                        <div id="progress-bar"><div id="progress-fill"></div></div>
                        <span id="progress-text">0%</span>
                    </div>
                </div>
                <div id="lesson-instructions"></div>
                <div id="sheet-display">
                    <div id="note-sequence"></div>
                    <div id="current-note-pointer">▼</div>
                </div>
                <div id="lesson-feedback">
                    <div id="feedback-message"></div>
                    <div id="score-display">
                        <span class="score-correct">✓ <span id="correct-count">0</span></span>
                        <span class="score-wrong">✗ <span id="wrong-count">0</span></span>
                        <span class="score-streak">🔥 <span id="streak-count">0</span></span>
                    </div>
                </div>
            </div>

            <!-- Free Practice View -->
            <div id="free-practice-view">
                <div id="note-history">
                    <h3>Notas tocadas</h3>
                    <div id="history-notes"></div>
                </div>
            </div>

            <!-- Lessons View -->
            <div id="lessons-view" class="hidden">
                <h2 class="view-title">Lecciones de Piano</h2>
                <div id="lessons-grid"></div>
            </div>

            <!-- Songs View -->
            <div id="songs-view" class="hidden">
                <h2 class="view-title">Canciones para Practicar</h2>
                <div id="songs-grid"></div>
            </div>

            <!-- Piano Keyboard -->
            <div id="piano-container">
                <div id="piano-controls">
                    <button id="octave-down" class="piano-ctrl-btn">◀ Octava</button>
                    <span id="octave-range">C3 - C5</span>
                    <button id="octave-up" class="piano-ctrl-btn">Octava ▶</button>
                    <label class="toggle-label">
                        <input type="checkbox" id="show-labels" checked>
                        Mostrar notas
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="show-solfege">
                        Do-Re-Mi
                    </label>
                </div>
                <div id="piano-keyboard"></div>
            </div>
        </main>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Configuración</h2>
                <div class="setting-group">
                    <label>Sensibilidad del micrófono</label>
                    <input type="range" id="mic-sensitivity" min="0" max="100" value="50">
                    <span id="sensitivity-value">50%</span>
                </div>
                <div class="setting-group">
                    <label>Umbral de detección (dB)</label>
                    <input type="range" id="noise-threshold" min="-60" max="-20" value="-40">
                    <span id="threshold-value">-40 dB</span>
                </div>
                <div class="setting-group">
                    <label>Velocidad de lección</label>
                    <select id="lesson-speed">
                        <option value="slow">Lento</option>
                        <option value="normal" selected>Normal</option>
                        <option value="fast">Rápido</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Referencia de afinación (Hz)</label>
                    <input type="number" id="tuning-ref" value="440" min="430" max="450" step="1">
                </div>
                <button id="close-settings" class="btn-primary">Cerrar</button>
            </div>
        </div>

        <!-- Completion Modal -->
        <div id="completion-modal" class="modal hidden">
            <div class="modal-content completion-content">
                <div id="completion-icon">🎉</div>
                <h2 id="completion-title">¡Lección Completada!</h2>
                <div id="completion-stats"></div>
                <div class="completion-buttons">
                    <button id="retry-lesson" class="btn-secondary">Repetir</button>
                    <button id="next-lesson" class="btn-primary">Siguiente Lección</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/audio-engine.js"></script>
    <script src="js/pitch-detector.js"></script>
    <script src="js/piano-ui.js"></script>
    <script src="js/lessons.js"></script>
    <script src="js/songs.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
